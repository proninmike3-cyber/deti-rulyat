<path d="m226 443 228 27 164 69-49 100-272-69-68-68Z" fill="url(#side)"/>
<path d="M226 443c65 28 139 40 229 47l163 65" stroke="#ffc36b" stroke-width="15" fill="none" opacity=".8"/>
