<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="t d">
<title id="t">Яркая иллюстрация детского электромобиля</title><desc id="d">Оранжевая игрушечная спортивная машинка на стилизованной гоночной площадке</desc>
<defs>
<linearGradient id="road" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#243854"/><stop offset="1" stop-color="#0b1b32"/></linearGradient>
<linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb456"/><stop offset=".35" stop-color="#ff743f"/><stop offset=".82" stop-color="#ed4e26"/><stop offset="1" stop-color="#b92925"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ff9145"/><stop offset="1" stop-color="#d73a25"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#d4fbff"/><stop offset=".5" stop-color="#70c9e0"/><stop offset="1" stop-color="#2e789a"/></linearGradient>
<linearGradient id="tire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26364e"/><stop offset="1" stop-color="#080f20"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
<filter id="sm" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#06203b" flood-opacity=".25"/></filter>
<pattern id="dash" width="82" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><rect x="10" y="7" width="45" height="7" rx="3" fill="#e6eff9" opacity=".65"/></pattern>
</defs>
<!-- yellow speed field -->
<path d="M191 120C290 32 607 26 786 156c184 134 194 345 18 503-139 125-402 148-593 38C53 606 42 353 191 120Z" fill="#ffe57d"/>
<circle cx="766" cy="150" r="67" fill="#d1f1f1"/><circle cx="181" cy="564" r="39" fill="#c9f0e7"/>
<g transform="rotate(-14 500 475)"><rect x="65" y="296" width="904" height="345" rx="100" fill="url(#road)"/><rect x="79" y="320" width="873" height="298" rx="86" fill="none" stroke="#ffffff" stroke-width="10" opacity=".15"/><rect x="110" y="446" width="805" height="18" rx="8" fill="url(#dash)"/></g>
<!-- dynamic little flag -->
<g transform="translate(756 75) rotate(16)"><path d="M0 0v205" stroke="#172943" stroke-width="13" stroke-linecap="round"/><path d="M5 9h122v92H5z" fill="#fff"/><path d="M5 9h30v23H5zm60 0h30v23H65zm30 23h32v23H95zM35 32h30v23H35zM5 55h30v23H5zm60 0h30v23H65zm30 23h32v23H95zM35 78h30v23H35z" fill="#182b45"/></g>
<!-- speed swishes -->
<path d="M81 349h194" stroke="#ff7d4c" stroke-width="19" stroke-linecap="round"/><path d="M50 387h164" stroke="#f9b44d" stroke-width="11" stroke-linecap="round"/><path d="M103 421h111" stroke="#ff7d4c" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="515" cy="634" rx="333" ry="66" fill="#020b1d" opacity=".5" filter="url(#blur)"/>
<!-- detailed toy sports car, 3/4 from front-right -->
<g filter="url(#sm)" transform="translate(48 33)">
<!-- rear wheels -->
<g transform="translate(278 535) rotate(-12)"><ellipse rx="68" ry="96" fill="#081326"/><ellipse rx="55" ry="86" fill="url(#tire)"/><ellipse rx="37" ry="57" fill="#41536a"/><ellipse rx="25" ry="43" fill="#d5e0e2"/><ellipse rx="12" ry="23" fill="#213449"/><path d="M-54-38h27M-64-6h26M-60 26h28M20-61h24M27-32h32M25 13h34M16 49h32" stroke="#091528" stroke-width="8" stroke-linecap="round"/></g>
<!-- interior cabin shell -->
<path d="M326 333c27-85 94-137 193-155 87-13 173 14 217 88l24 83-373 77Z" fill="#e65b35" stroke="#b9302a" stroke-width="10"/>
<path d="M380 323c23-62 78-93 151-108 71-10 139 9 166 57l17 55-315 61Z" fill="#11344c" stroke="#ffe2a4" stroke-width="7"/>
<path d="M417 317c22-42 64-64 113-74 24-4 48-4 68 1l-50 112-143 29Z" fill="url(#glass)"/>
<path d="M615 251c27 4 50 17 66 38l9 36-119 23Z" fill="url(#glass)"/>
<path d="m410 301 131-28" stroke="#efffff" stroke-width="10" opacity=".65" stroke-linecap="round"/>
