<path d="M381 452 452 375 591 356l-15 166-73 74-126-37Z" fill="#ed6336" stroke="#cc452d" stroke-width="6"/>
<path d="M398 468 475 391 553 378" stroke="#ffbf69" stroke-width="11" fill="none" stroke-linecap="round"/>
<rect x="451" y="451" width="48" height="14" rx="7" transform="rotate(-15 451 451)" fill="#a93129"/>
