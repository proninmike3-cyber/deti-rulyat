<path d="m612 495 257-77 42 74c10 21 2 43-24 56l-265 99-55-28Z" fill="#ef5934" stroke="#a92b29" stroke-width="7"/>
<path d="m648 517 235-74 16 44-229 81Z" fill="#263b55"/>
<path d="m672 530 200-61" stroke="#526981" stroke-width="7"/>
<path d="m664 585 218-78" stroke="#ffc26c" stroke-width="14" stroke-linecap="round"/>
<!-- headlights -->
<path d="m618 461 83-24 24 23-75 27Z" fill="#e8feff" stroke="#a2dce5" stroke-width="7"/>
<path d="m827 400 49 24-37 13-39-25Z" fill="#e8feff" stroke="#a2dce5" stroke-width="5"/>
<!-- front right wheel -->
<g transform="translate(755 583) rotate(18)"><ellipse rx="76" ry="98" fill="#091426"/><ellipse rx="62" ry="88" fill="url(#tire)"/><ellipse rx="42" ry="59" fill="#3e516b"/><ellipse rx="32" ry="47" fill="#e2eaeb"/><ellipse rx="24" ry="36" fill="#99b4c3"/><ellipse rx="10" ry="13" fill="#19364c"/><g stroke="#21364c" stroke-width="6"><path d="M-20-30 20 30M20-30-20 30M0-40v80M-31 0h62"/></g></g>
<!-- bumpers, toy seams -->
<path d="m285 544 103 33" stroke="#ffd6a1" stroke-width="8" stroke-linecap="round"/>
<path d="m625 612-53 18" stroke="#9d2b28" stroke-width="14" stroke-linecap="round"/>
<circle cx="639" cy="411" r="17" fill="#fff"/><circle cx="639" cy="411" r="8" fill="#ffad40"/>
</g>
<!-- sparkles -->
<g fill="#fff"><path d="m139 159 9 27 27 9-27 9-9 27-9-27-27-9 27-9Z"/><path d="m898 300 7 20 20 7-20 7-7 20-7-20-20-7 20-7Z"/></g>
<g fill="#ff723b"><circle cx="110" cy="274" r="10"/><circle cx="887" cy="668" r="13"/><circle cx="834" cy="725" r="8"/></g>
