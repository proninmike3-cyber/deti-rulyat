<!-- back body -->
<path d="M279 392c67-42 178-63 306-59l138-33c37 0 78 18 103 43l62 77-70 121-263 92-298-82-62-86c-10-30 34-57 84-73Z" fill="url(#carBody)" stroke="#c83e26" stroke-width="7"/>
